<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Manage photos — John Wright &amp; Madhulika</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baskervville+SC&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Great+Vibes&family=Italianno&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="page-photos">
    <header class="site-header">
      <a class="logo-link" href="index.html">
        <span class="logo">
          <img src="assets/logo.png" alt="J and M monogram" />
        </span>
      </a>
      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav">
        <span class="sr-only">Menu</span>
        <span class="nav-toggle-icon" aria-hidden="true"></span>
      </button>
      <nav class="nav" id="site-nav" aria-label="Primary">
        <a class="nav-link" href="index.html">
          HOME
          <img src="assets/nav-line.svg" alt="" width="73" height="1" />
        </a>
        <a class="nav-link" href="rsvp.html">
          RSVP
          <img src="assets/nav-line.svg" alt="" width="73" height="1" />
        </a>
        <a class="nav-link" href="registry.html">
          REGISTRY
          <img src="assets/nav-line.svg" alt="" width="73" height="1" />
        </a>
        <a class="nav-link" href="photos.html">
          PHOTOS
          <img src="assets/nav-line.svg" alt="" width="73" height="1" />
        </a>
      </nav>
    </header>

    <main class="rsvp-main">
      <section class="rsvp-card photos-card" aria-labelledby="manage-title">
        <h1 id="manage-title">PHOTOS</h1>
        <p class="rsvp-lead">
          This page is only for the two of you. It is not in the menu. Remove any picture you do not
          want in the album.
        </p>

        <form class="rsvp-form" id="manage-form">
          <div class="rsvp-field">
            <label for="manage-key">Password</label>
            <input
              class="rsvp-input"
              id="manage-key"
              type="password"
              autocomplete="current-password"
              required
            />
          </div>
          <button class="rsvp-submit" type="submit">OPEN</button>
        </form>
        <p class="photo-status" id="photo-status" role="alert"></p>

        <div class="photo-grid" id="photo-grid" hidden></div>
      </section>
    </main>

    <script src="photos-config.js"></script>
    <script src="script.js"></script>
  </body>
</html>
