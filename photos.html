<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Photos — John Wright &amp; Madhulika</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baskervville+SC&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Great+Vibes&family=Italianno&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="page-photos">
    <header class="site-header">
      <a class="logo-link" href="index.html">
        <span class="logo">
          <img src="assets/logo.png" alt="J and M monogram" />
        </span>
      </a>
      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav">
        <span class="sr-only">Menu</span>
        <span class="nav-toggle-icon" aria-hidden="true"></span>
      </button>
      <nav class="nav" id="site-nav" aria-label="Primary">
        <a class="nav-link" href="index.html">
          HOME
          <img src="assets/nav-line.svg" alt="" width="73" height="1" />
        </a>
        <a class="nav-link" href="rsvp.html">
          RSVP
          <img src="assets/nav-line.svg" alt="" width="73" height="1" />
        </a>
        <a class="nav-link" href="registry.html">
          REGISTRY
          <img src="assets/nav-line.svg" alt="" width="73" height="1" />
        </a>
        <a class="nav-link is-active" href="photos.html" aria-current="page">
          PHOTOS
          <img src="assets/nav-line.svg" alt="" width="73" height="1" />
        </a>
      </nav>
    </header>

    <main class="rsvp-main">
      <section class="rsvp-card photos-card" aria-labelledby="photos-title">
        <h1 id="photos-title">PHOTOS</h1>
        <p class="rsvp-lead">
          A shared album from the evening, gathered by the people who were there. Pictures from before
          the ceremony and after it appear here as they arrive.
        </p>

        <div class="photo-add">
          <label class="photo-add-button">
            <span>ADD A PHOTO</span>
            <input id="photo-file" type="file" accept="image/*" />
          </label>
        </div>
        <p class="photo-status" id="photo-status" role="status"></p>
        <p class="photo-empty" id="photo-empty">Photos from the evening will gather here.</p>
        <div class="photo-grid" id="photo-grid" hidden></div>

        <dialog class="photo-view" id="photo-view" aria-label="Photo">
          <img id="photo-view-img" alt="" />
          <div class="photo-view-actions">
            <button class="photo-save" id="photo-save" type="button">SAVE PHOTO</button>
            <button class="photo-view-close" id="photo-view-close" type="button">CLOSE</button>
          </div>
        </dialog>
      </section>
    </main>

    <script src="photos-config.js"></script>
    <script src="script.js"></script>
  </body>
</html>
